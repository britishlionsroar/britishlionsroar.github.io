<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Evidence Library | Admin</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#192330;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}header{background:#142a37;color:white;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px}header h1{font-size:1.25rem;margin:0}main{max-width:1100px;margin:30px auto;padding:0 16px}.panel{background:white;border:1px solid #dce3e8;border-radius:12px;padding:22px;margin-bottom:18px;box-shadow:0 2px 8px #10203009}h2{margin-top:0;font-size:1.2rem}label{display:block;font-weight:600;margin:12px 0 5px}input,textarea,select{width:100%;padding:10px;border:1px solid #aebbc4;border-radius:7px;font:inherit}textarea{min-height:100px}button{border:0;border-radius:7px;background:#136c70;color:white;padding:10px 15px;font:inherit;font-weight:600;cursor:pointer}button.secondary{background:#435769}button.danger{background:#8c3030}button:disabled{opacity:.5;cursor:wait}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.row button{flex:0 auto}.muted{color:#586875}.error{color:#a42626}.success{color:#14633e}.hidden{display:none!important}.story{border:1px solid #dbe3e8;border-radius:9px;padding:15px;margin:12px 0}.story h3{margin:0 0 6px}.pill{display:inline-block;border-radius:20px;padding:3px 9px;background:#e5edef;font-size:.83rem}.meta{font-size:.85rem;color:#586875}a{color:#12646c;overflow-wrap:anywhere}details{margin-top:12px}summary{cursor:pointer;font-weight:600}.resource{padding:7px 0;border-top:1px solid #eee}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tabs button{background:#dbe7e9;color:#16343a}.tabs button.active{background:#136c70;color:white}.narrow{max-width:480px}.small{font-size:.88rem}.activity{padding:9px 0;border-bottom:1px solid #e4e8ea}@media(max-width:600px){header{align-items:flex-start;flex-direction:column}.row{flex-direction:column;align-items:stretch}.row button{width:100%}}
</style></head><body><header><h1>Evidence Library</h1><div class="row"><span id="who"></span><button id="signout" class="secondary hidden">Sign out</button></div></header><main><div id="notice" role="status" aria-live="polite"></div>
<section id="login" class="panel narrow"><h2>Administrator sign-in</h2><p class="muted">This library is restricted to approved group administrators.</p><form id="loginform"><label for="email">Email address</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><p><button type="submit">Sign in</button></p></form></section>
<div id="app" class="hidden"><section class="panel"><h2>Investigation dashboard</h2><p class="muted">All approved administrators can manage research and publication status. Changes to status are logged.</p><div class="row"><div><label for="weekfilter">Weekly theme</label><select id="weekfilter"><option value="">All themes</option></select></div><div><label for="search">Find an investigation</label><input id="search" placeholder="Search titles and summaries"></div></div><div class="tabs" id="tabs"></div><p id="count" class="muted"></p><div id="stories"></div></section>
<section class="panel"><h2>Add an investigation</h2><form id="storyform"><label for="storytitle">Title</label><input id="storytitle" required maxlength="200"><label for="storyweek">Weekly theme</label><select id="storyweek"><option value="">No theme yet</option></select><label for="storysummary">Summary and research notes</label><textarea id="storysummary"></textarea><p><button type="submit">Add investigation</button></p></form></section>
<section class="panel"><h2>Weekly themes</h2><form id="weekform"><label for="weektitle">New theme title</label><input id="weektitle" required placeholder="e.g. Week 1 — Origins of Restore Britain"><label for="weekdesc">Description</label><textarea id="weekdesc"></textarea><p><button type="submit">Add theme</button></p></form><div id="weeklist"></div></section>
<section class="panel"><h2>Recent activity</h2><div id="activity"></div></section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script>
(()=>{'use strict';const URL='https://nklibokflyvmiihhbjvo.supabase.co',KEY='sb_publishable_rFkcKcLnhgIyJemkdK5n4g_D3FkxIGP';const db=window.supabase.createClient(URL,KEY);const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let user=null,weeks=[],stories=[],resources=[],activity=[],filter='all';const statuses={investigating:'Under Investigation',authorised:'Authorised for Publication',awaiting_publication:'Awaiting Publication',published:'Published'};function notice(msg,bad=false){$('notice').innerHTML=msg?`<div class="panel ${bad?'error':'success'}">${esc(msg)}</div>`:''}function show(logged){$('login').classList.toggle('hidden',logged);$('app').classList.toggle('hidden',!logged);$('signout').classList.toggle('hidden',!logged);$('who').textContent=logged?(user?.email||'Administrator'):''}async function check(){const {data:{user:u}}=await db.auth.getUser();user=u;if(!u){show(false);return}const {data,error}=await db.from('admins').select('user_id').eq('user_id',u.id).maybeSingle();if(error||!data){show(false);notice('This account is not yet approved as an Evidence Library administrator.',true);return}show(true);await load()}async function load(){const [w,s,r,a]=await Promise.all([db.from('weeks').select('*').order('created_at',{ascending:true}),db.from('stories').select('*').order('updated_at',{ascending:false}),db.from('resources').select('*').order('created_at',{ascending:false}),db.from('activity').select('*').order('created_at',{ascending:false}).limit(40)]);for(const x of [w,s,r,a])if(x.error){notice(x.error.message,true);return}weeks=w.data;stories=s.data;resources=r.data;activity=a.data;render()}function render(){for(const id of ['weekfilter','storyweek']){const el=$(id),v=el.value;el.innerHTML=`<option value="">${id==='weekfilter'?'All themes':'No theme yet'}</option>`+weeks.map(w=>`<option value="${esc(w.id)}">${esc(w.title)}</option>`).join('');el.value=v} $('weeklist').innerHTML=weeks.length?weeks.map(w=>`<p><strong>${esc(w.title)}</strong> — ${esc(w.description)}</p>`).join(''):'<p class="muted">No themes yet.</p>';$('tabs').innerHTML=[['all','All'],...Object.entries(statuses)].map(([k,v])=>`<button type="button" class="${filter===k?'active':''}" data-filter="${k}">${v}</button>`).join('');const q=$('search').value.toLowerCase(),wf=$('weekfilter').value;const visible=stories.filter(s=>(filter==='all'||s.status===filter)&&(!wf||s.week_id===wf)&&(`${s.title} ${s.summary}`.toLowerCase().includes(q)));$('count').textContent=`${visible.length} investigation${visible.length===1?'':'s'} shown`;$('stories').innerHTML=visible.length?visible.map(s=>{const rs=resources.filter(r=>r.story_id===s.id);return `<article class="story"><h3>${esc(s.title)}</h3><span class="pill">${esc(statuses[s.status]||s.status)}</span> <span class="meta">${esc(weeks.find(w=>w.id===s.week_id)?.title||'Unassigned')}</span><p>${esc(s.summary).replace(/\n/g,'<br>')}</p>${s.facebook_url?`<p><a href="${esc(s.facebook_url)}" target="_blank" rel="noopener noreferrer">View published Facebook post</a> — ${esc(s.publication_date?.slice(0,10)||'')}</p>`:''}<details><summary>Edit investigation</summary><form data-edit="${esc(s.id)}"><label>Title</label><input name="title" required value="${esc(s.title)}"><label>Research notes</label><textarea name="summary">${esc(s.summary)}</textarea><label>Weekly theme</label><select name="week_id"><option value="">No theme</option>${weeks.map(w=>`<option value="${esc(w.id)}" ${s.week_id===w.id?'selected':''}>${esc(w.title)}</option>`).join('')}</select><label>Publication status</label><select name="status">${Object.entries(statuses).map(([k,v])=>`<option value="${k}" ${s.status===k?'selected':''}>${v}</option>`).join('')}</select><label>Facebook post URL (required when published)</label><input name="facebook_url" type="url" value="${esc(s.facebook_url||'')}"><label>Publication date (required when published)</label><input name="publication_date" type="date" value="${esc(s.publication_date?.slice(0,10)||'')}"><p><button>Save changes</button></p></form></details><details><summary>Evidence and resources (${rs.length})</summary>${rs.map(r=>`<div class="resource"><strong>${esc(r.title)}</strong> <span class="meta">${esc(r.kind)} ${r.verified?'· Verified':''}</span>${r.url?` — <a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">Open source</a>`:''}<p>${esc(r.notes)}</p></div>`).join('')}<form data-resource="${esc(s.id)}"><label>Resource title</label><input name="title" required><label>Type</label><select name="kind">${['source','document','article','graphic','facebook_copy','other'].map(k=>`<option value="${k}">${k.replace('_',' ')}</option>`).join('')}</select><label>Link (optional)</label><input name="url" type="url"><label>Notes</label><textarea name="notes"></textarea><label><input type="checkbox" name="verified" style="width:auto"> Verified source</label><p><button>Add resource</button></p></form></details></article>`}).join(''):'<p class="muted">No investigations match this view.</p>';$('activity').innerHTML=activity.length?activity.map(a=>`<div class="activity"><span class="meta">${esc(new Date(a.created_at).toLocaleString())}</span> — ${esc(a.action)}${a.old_status||a.new_status?`: ${esc(statuses[a.old_status]||a.old_status||'')} → ${esc(statuses[a.new_status]||a.new_status||'')}`:''}<br><span class="small">${esc(stories.find(s=>s.id===a.story_id)?.title||'Removed investigation')} · ${esc(a.actor_id||'System')}</span></div>`).join(''):'<p class="muted">No activity recorded yet.</p>'}async function save(table,data){const {error}=await db.from(table).insert(data);if(error)notice(error.message,true);else{notice('Saved successfully.');await load();return true}return false}$('loginform').addEventListener('submit',async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});b.disabled=false;$('password').value='';if(error)notice(error.message,true);else{notice('');await check()}});$('signout').onclick=async()=>{await db.auth.signOut();user=null;show(false);notice('Signed out.')};$('storyform').onsubmit=async e=>{e.preventDefault();if(await save('stories',{title:$('storytitle').value.trim(),summary:$('storysummary').value,week_id:$('storyweek').value||null})){e.target.reset()}};$('weekform').onsubmit=async e=>{e.preventDefault();if(await save('weeks',{title:$('weektitle').value.trim(),description:$('weekdesc').value})){e.target.reset()}};$('weekfilter').onchange=render;$('search').oninput=render;$('tabs').onclick=e=>{const b=e.target.closest('[data-filter]');if(b){filter=b.dataset.filter;render()}};$('stories').addEventListener('submit',async e=>{const f=e.target;if(f.dataset.edit){e.preventDefault();const v=Object.fromEntries(new FormData(f));if(v.status==='published'&&(!v.facebook_url||!v.publication_date)){notice('A published investigation needs a Facebook URL and publication date.',true);return}const payload={title:v.title,summary:v.summary,week_id:v.week_id||null,status:v.status,facebook_url:v.facebook_url||null,publication_date:v.publication_date?new Date(v.publication_date+'T12:00:00Z').toISOString():null};const {error}=await db.from('stories').update(payload).eq('id',f.dataset.edit);if(error)notice(error.message,true);else{notice('Investigation updated.');await load()}}else if(f.dataset.resource){e.preventDefault();const v=Object.fromEntries(new FormData(f));await save('resources',{story_id:f.dataset.resource,title:v.title,kind:v.kind,url:v.url||null,notes:v.notes,verified:v.verified==='on',created_by:user.id})}});check().catch(e=>notice(e.message,true))})();
</script></body></html>
